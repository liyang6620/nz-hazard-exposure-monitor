name: nz_hazard_exposure_monitor
version: 1.0.0
config-version: 2
profile: nz_hazard_exposure_monitor

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  reference_data_root: "{{ env_var('NZHEM_REFERENCE_DATA_ROOT', '') }}"
  event_data_root: "{{ env_var('NZHEM_EVENT_DATA_ROOT', '') }}"

models:
  nz_hazard_exposure_monitor:
    +materialized: table

seeds:
  nz_hazard_exposure_monitor:
    +quote_columns: false
    reference_buildings:
      +column_types:
        meshblock_code: varchar
        sa1_code: varchar
        sa2_code: varchar
        region_code: varchar
        territorial_authority_code: varchar
        h3_res8: ubigint
        h3_res6: ubigint
    reference_population:
      +column_types:
        sa1_code: varchar
        land_water: varchar
        fallback_h3_res8: ubigint
        fallback_h3_res6: ubigint
    event_shaking_h3:
      +column_types:
        event_id: varchar
        h3_res8: ubigint
        h3_res6: ubigint
    event_exposure_cell:
      +column_types:
        event_id: varchar
        h3_res8: ubigint
        h3_res6: ubigint
        event_building_count: bigint
        event_footprint_area_m2: double
        as_if_today_building_count: bigint
        as_if_today_footprint_area_m2: double
        current_building_count: bigint
        current_footprint_area_m2: double
        population_2023: double
    event_catalog:
      +column_types:
        event_id: varchar
        valid_buildings: bigint
        as_if_today_buildings: bigint
        event_time_status: varchar
    mmi_validation:
      +column_types:
        event_id: varchar
    reference_boundaries:
      +column_types:
        meshblock_code: varchar
        sa1_code: varchar
        sa2_code: varchar
        region_code: varchar
        territorial_authority_code: varchar
