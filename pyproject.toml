[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nz-hazard-exposure-monitor"
version = "0.1.0"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "hosts", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--strict-markers --cov=nzhem --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
omit = ["src/nzhem/adapters/azure/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
