[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app/src", "app/tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["app/src"]
addopts = "--strict-markers --cov=nzhem --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
