name: nzhem

services:
  app:
    build:
      context: .
      dockerfile: hosts/local/Dockerfile
      args:
        VITE_LINZ_LDS_TILES_API_KEY: "${VITE_LINZ_LDS_TILES_API_KEY:-}"
    env_file:
      - path: .env
        required: false
    environment:
      NZHEM_ENV: local
      NZHEM_DATA_ROOT: /data
      NZHEM_SQLITE_PATH: /state/nzhem.sqlite3
      NZHEM_SITE_ASSETS_ROOT: /workspace/frontend-dist
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      ARCGIS_PUBLISHER_ENABLED: "false"
      POLL_INTERVAL_MINUTES: "60"
      GEONET_POLL_ENABLED: "${GEONET_POLL_ENABLED:-true}"
      RUN_STARTUP_HOUSEKEEPING: "true"
      EVENT_PROCESSING_TIMEOUT_MINUTES: "60"
      EVENT_PROCESSING_BATCH_SIZE: "100"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - nzhem-data:/data
      - nzhem-state:/state
    depends_on:
      mailpit:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  web:
    image: caddy:2.8.4-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - nzhem-data:/srv:ro
      - ./hosts/local/Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    profiles: [azure-dev]
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "127.0.0.1:${AZURITE_BLOB_PORT:-10000}:10000"
      - "127.0.0.1:${AZURITE_QUEUE_PORT:-10001}:10001"
      - "127.0.0.1:${AZURITE_TABLE_PORT:-10002}:10002"
    volumes:
      - azurite-data:/data

volumes:
  nzhem-data:
  nzhem-state:
  azurite-data:

