name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-and-dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - run: ruff check app scripts
      - run: ruff format --check app scripts
      - run: pytest
      - run: sqlfluff lint dbt/models --dialect duckdb
      - run: dbt build --project-dir dbt --profiles-dir dbt/profiles --target duckdb_local

  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - infra/bootstrap
          - infra/providers
          - infra/identity
          - infra/guardrails
          - infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
      - run: terraform fmt -check -recursive
      - working-directory: ${{ matrix.root }}
        run: terraform init -backend=false -input=false
      - working-directory: ${{ matrix.root }}
        run: terraform validate

  linux-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install duckdb==1.4.1
      - run: bash scripts/build_function_package.sh | tee package-size.json
      - name: Enforce the one GB ZIP limit
        run: python -c "import json; d=json.load(open('package-size.json')); assert d['below_zip_limit'], d"
      - uses: actions/upload-artifact@v4
        with:
          name: function-package-${{ github.sha }}
          path: |
            dist/function.zip
            package-size.json
          if-no-files-found: error
          retention-days: 7

  public-identifier-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject committed Azure identifiers or personal email addresses
        shell: bash
        run: |
          if git grep -nE '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}'; then
            echo 'A GUID-like identifier is committed.' >&2
            exit 1
          fi
          if git grep -nE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' | grep -vE '@example\.(com|invalid|azurecomm\.net)'; then
            echo 'A non-example email address is committed.' >&2
            exit 1
          fi
