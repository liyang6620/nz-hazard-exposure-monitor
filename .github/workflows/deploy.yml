name: Deploy Function App

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.AZURE_DEPLOYMENT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      AZURE_CORE_OUTPUT: "none"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e . azure-identity==1.25.1 azure-storage-blob==12.27.1
      - name: Record deployment start time
        run: echo "DEPLOY_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - run: python -m pip install duckdb==1.4.1
      - run: bash scripts/build_function_package.sh | tee package-size.json
      - name: Enforce package limit
        run: python -c "import json; d=json.load(open('package-size.json')); assert d['below_zip_limit'], d"
      - name: Verify package source commit
        run: test "$(cat dist/function/build_git_sha.txt)" = "$GITHUB_SHA"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build React application
        working-directory: frontend
        env:
          VITE_LINZ_LDS_TILES_API_KEY: ${{ secrets.LINZ_LDS_TILES_API_KEY }}
          VITE_REVIEW_API_BASE_URL: https://${{ secrets.AZURE_FUNCTION_APP_NAME }}.azurewebsites.net/api/review-briefing
        run: |
          npm ci
          npm run build
      - name: Publish static application
        run: >-
          python scripts/deploy_static_site.py
          --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}"
      - name: Use managed identity for Function host storage
        shell: bash
        run: |
          if az functionapp config appsettings list \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_FUNCTION_APP_NAME }}" \
            --query "[?name=='AzureWebJobsStorage'].name" --output tsv \
            | grep -qx AzureWebJobsStorage; then
            az functionapp config appsettings delete \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --name "${{ secrets.AZURE_FUNCTION_APP_NAME }}" \
              --setting-names AzureWebJobsStorage --only-show-errors --output none
          fi
      - name: Deploy immutable package with Flex One Deploy
        run: >-
          az functionapp deploy
          --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}"
          --name "${{ secrets.AZURE_FUNCTION_APP_NAME }}"
          --src-path dist/function.zip
          --type zip
          --timeout 1800000
      - name: Verify host storage uses managed identity
        shell: bash
        run: |
          settings="$(az functionapp config appsettings list \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_FUNCTION_APP_NAME }}" --output json)"
          SETTINGS_JSON="$settings" python - <<'PY'
          import json, os
          values = {row['name']: row['value'] for row in json.loads(os.environ['SETTINGS_JSON'])}
          assert 'AzureWebJobsStorage' not in values
          assert values.get('AzureWebJobsStorage__credential') == 'managedidentity'
          assert values.get('AzureWebJobsStorage__accountName')
          PY
      - name: Verify deployed commit and trigger indexing
        shell: bash
        run: |
          function_url="https://${{ secrets.AZURE_FUNCTION_APP_NAME }}.azurewebsites.net"
          for attempt in {1..18}; do
            build="$(curl --silent --max-time 20 -D - -o /dev/null \
              "${function_url}/api/review-briefing" \
              | tr -d '\r' | awk 'tolower($1)=="x-nzhem-build:" {print $2}' | tail -1)"
            if [ "$build" = "$GITHUB_SHA" ]; then
              break
            fi
            sleep 10
          done
          test "$build" = "$GITHUB_SHA"
          count="$(az functionapp function list \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_FUNCTION_APP_NAME }}" \
            --query 'length(@)' --output tsv)"
          test "$count" = 6
      - name: Verify the next scheduled site-data publication
        shell: bash
        run: |
          site_url="$(az storage account show \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
            --query 'primaryEndpoints.web' --output tsv)"
          for attempt in {1..225}; do
            if curl --fail --silent --show-error \
              "${site_url%/}/data/manifest.json" -o site-manifest.json; then
              if python -c "import json,os; from datetime import datetime; d=json.load(open('site-manifest.json')); started=datetime.fromisoformat(os.environ['DEPLOY_STARTED_AT'].replace('Z','+00:00')); published=datetime.fromisoformat(d['generated_at'].replace('Z','+00:00')); assert published >= started"; then
                exit 0
              fi
            fi
            sleep 20
          done
          echo 'The next hourly timer did not publish fresh site data.' >&2
          exit 1
