name: Deploy Function App

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ false }} # D31: disabled until the Microsoft account is restored.
    runs-on: ubuntu-latest
    environment: production
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      AZURE_CORE_OUTPUT: "none"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install duckdb==1.4.1
      - run: bash scripts/build_function_package.sh | tee package-size.json
      - name: Enforce package limit
        run: python -c "import json; d=json.load(open('package-size.json')); assert d['below_zip_limit'], d"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy immutable package
        run: >-
          az functionapp deployment source config-zip
          --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}"
          --name "${{ secrets.AZURE_FUNCTION_APP_NAME }}"
          --src dist/function.zip
          --timeout 1800
      - name: Verify functions and startup housekeeping run
        shell: bash
        run: |
          az functionapp function list \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_FUNCTION_APP_NAME }}" \
            --query '[].name' --output table
          for attempt in {1..15}; do
            count="$(az storage entity query \
              --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
              --table-name runs --auth-mode login \
              --filter "PartitionKey eq 'housekeeping' and status eq 'success'" \
              --query 'length(items)' --output tsv)"
            if [ "${count:-0}" -gt 0 ]; then
              exit 0
            fi
            sleep 20
          done
          echo 'No successful startup housekeeping run was recorded.' >&2
          exit 1
